schemaVersion: 1

allowedLinkHosts:
  - navet.app
  - demo.navet.app
  - docs.navet.app
  - github.com

channels:
  navet-subreddit:
    label: Navet subreddit
    kind: owned-community
    audience: People using, evaluating, or contributing to Navet
    format: native-reddit-post
    maxCharacters: 12000
    destinationUrl: https://www.reddit.com/r/navet/
    requiresAffiliationDisclosure: false
    requiresRulePreflight: false
    publishing: manual
  navet-discord:
    label: Navet Discord
    kind: owned-community
    audience: Current community members and people actively trying Navet
    format: discord-message
    maxCharacters: 2000
    destinationUrl: https://discord.com/channels/1540491864325623892
    requiresAffiliationDisclosure: false
    requiresRulePreflight: false
    publishing: manual
  youtube:
    label: Navet YouTube
    kind: owned-video
    audience: People who want to see Navet working before installing it
    format: narrated-screen-video
    maxCharacters: 5000
    destinationUrl: https://www.youtube.com/@navetapp
    requiresAffiliationDisclosure: false
    requiresRulePreflight: false
    publishing: manual
  homeassistant-reddit:
