# Reachable only by the authenticated njs handler, never by an external HTTP request.
location = /__navet_rss_transport__ {
  internal;
  # Nginx captures the body using this subrequest location, not its njs caller.
  subrequest_output_buffer_size 1m;
  client_max_body_size 8k;
  proxy_pass http://unix:/run/navet/rss-transport.sock:/;
  proxy_pass_request_headers off;
  proxy_set_header Host localhost;
  proxy_set_header Content-Type text/plain;
  proxy_set_header Connection close;
  proxy_connect_timeout 2s;
  proxy_send_timeout 10s;
  proxy_read_timeout 12s;
}
