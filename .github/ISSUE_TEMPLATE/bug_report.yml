name: Report a problem
description: Tell us what went wrong. No technical knowledge or detailed diagnostics needed.
title: "[Problem]: "
labels:
  - "status: needs-triage"
  - "type: bug"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us improve Navet. Describe the problem in your own words; maintainers can ask for technical details later if they need them.

        Do not include Home Assistant tokens, private URLs, addresses, or screenshots that expose sensitive home details.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Tell us what you were trying to do, what happened, and what you expected instead.
      placeholder: "I tried to ... but ... I expected ..."
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Where did you notice it?
      description: A screen, device, browser, or installation type is enough. Leave this blank if you are unsure.
      placeholder: "Dashboard on an iPad, Home Assistant App"
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Optional screenshot or extra context
      description: Add a redacted screenshot, example, or any other detail that might help.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed credentials, private URLs, addresses, and sensitive household details.
          required: true
