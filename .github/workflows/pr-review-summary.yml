name: Publish PR Review Summary

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  issues: write
  pull-requests: read
  statuses: read

jobs:
  summary:
    name: Update mobile-friendly review comment
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch automation
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create Navet Nisse comment token
        id: navet_nisse_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.NAVET_NISSE_APP_ID }}
          private-key: ${{ secrets.NAVET_NISSE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write

      - name: Publish readiness and preview links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAVET_NISSE_TOKEN: ${{ steps.navet_nisse_token.outputs.token }}
        run: node scripts/update-pr-review-summary.mjs
