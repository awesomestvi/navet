name: Publish PR Review Summary

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  issues: write
  pull-requests: read
  statuses: read

jobs:
  summary:
    name: Update mobile-friendly review comment
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch automation
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish readiness and preview links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-pr-review-summary.mjs
