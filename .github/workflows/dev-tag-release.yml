name: Publish Navet Dev

on:
  workflow_dispatch:
  push:
    tags:
      - 'navet-dev-*'

permissions:
  contents: read
  packages: read

concurrency:
  group: navet-dev-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/navet

jobs:
  release-context:
    name: Validate Navet Dev Tag
    runs-on: ubuntu-latest

    outputs:
      dev_version: ${{ steps.version.outputs.dev_version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      release_sha: ${{ steps.version.outputs.release_sha }}
      release_sha_short: ${{ steps.version.outputs.release_sha_short }}
      source_branch: ${{ steps.version.outputs.source_branch }}
      main_backed: ${{ steps.version.outputs.main_backed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve Navet Dev version
        id: version
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          DEV_VERSION="${TAG_NAME#navet-dev-}"

          if [[ "${DEV_VERSION}" == "${TAG_NAME}" ]]; then
            echo "Navet Dev tag ${TAG_NAME} must start with navet-dev-."
            exit 1
          fi

          # actions/checkout can materialize a tag push as a commit ref. Fetch the remote tag
          # object explicitly so annotated provenance is available and cannot be mistaken for
          # the release commit message.
          git fetch --force --no-tags origin \
            "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
          if [[ "$(git cat-file -t "refs/tags/${TAG_NAME}")" != "tag" ]]; then
            echo "Navet Dev tag ${TAG_NAME} must be an annotated tag."
            exit 1
          fi

          RELEASE_SHA="$(git rev-list -n 1 "${TAG_NAME}")"
          SOURCE_BRANCH="$(
            git for-each-ref --format='%(contents)' "refs/tags/${TAG_NAME}" |
              sed -n 's/^Source-Branch: //p' |
              tail -n 1
          )"

          if [[ -z "${SOURCE_BRANCH}" ]]; then
            echo "Navet Dev tag ${TAG_NAME} is missing Source-Branch provenance."
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if [[ "${SOURCE_BRANCH}" == "main" ]] &&
            git merge-base --is-ancestor "${RELEASE_SHA}" refs/remotes/origin/main; then
            MAIN_BACKED=true
          else
            MAIN_BACKED=false
          fi

          CHECK_ARGS=(--tag "${TAG_NAME}" --version "${DEV_VERSION}")
          if [[ "${MAIN_BACKED}" == "true" ]]; then
            CHECK_ARGS+=(--allow-stale-addon-metadata)
          fi
          node scripts/check-dev-release-surfaces.mjs "${CHECK_ARGS[@]}"

          {
            echo "dev_version=${DEV_VERSION}"
            echo "tag_name=${TAG_NAME}"
            echo "release_sha=${RELEASE_SHA}"
            echo "release_sha_short=${RELEASE_SHA::7}"
            echo "source_branch=${SOURCE_BRANCH}"
            echo "main_backed=${MAIN_BACKED}"
          } >> "$GITHUB_OUTPUT"

  tier-1-release-critical:
    name: Release Safety Checks
    needs: release-context
    uses: ./.github/workflows/provider-platform-validation.yml
    with:
      runtime: false

  images:
    permissions:
      contents: read
      packages: write
    needs: [release-context, tier-1-release-critical]
    uses: ./.github/workflows/release-image.yml
    with:
      sha: ${{ needs.release-context.outputs.release_sha }}
      version: ${{ needs.release-context.outputs.dev_version }}
      standalone_tag: ${{ needs.release-context.outputs.dev_version }}
      channel: dev

  runtime:
    needs: [release-context, images]
    uses: ./.github/workflows/release-runtime.yml
    with:
      sha: ${{ needs.release-context.outputs.release_sha }}
      version: ${{ needs.release-context.outputs.dev_version }}
      channel: dev

  github-release:
    permissions:
      contents: write
    name: Create GitHub prerelease
    runs-on: ubuntu-latest
    needs:
      - release-context
      - runtime
    environment: edge

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build prerelease notes
        id: notes
        env:
          DEV_VERSION: ${{ needs.release-context.outputs.dev_version }}
          MAIN_BACKED: ${{ needs.release-context.outputs.main_backed }}
          RELEASE_SHA: ${{ needs.release-context.outputs.release_sha }}
          SOURCE_BRANCH: ${{ needs.release-context.outputs.source_branch }}
        run: |
          CHANGE_NOTES="${RUNNER_TEMP}/navet-dev-release-notes.md"
          node scripts/generate-release-notes.mjs --from "${RELEASE_SHA}^" --to "${RELEASE_SHA}" > "$CHANGE_NOTES"

          if [[ "${MAIN_BACKED}" == "true" ]]; then
            SCOPE_NOTE="This build is backed by \`main\`. It advances the shared \`dev\` and \`edge\` image aliases without changing protected \`main\` or Home Assistant Add-on Store metadata."
          else
            SCOPE_NOTE="This is an immutable branch validation build. It does not change \`main\`, the shared \`dev\` or \`edge\` aliases, or Home Assistant add-on discovery."
          fi

          {
            echo "body<<EOF"
            echo "Navet Dev publish for \`${DEV_VERSION}\`."
            echo
            echo "Source: \`${SOURCE_BRANCH}\` at \`${RELEASE_SHA}\`"
            echo
            cat "$CHANGE_NOTES"
            echo
            echo "$SCOPE_NOTE"
            echo
            echo "Published artifacts:"
            echo "- standalone app image \`${REGISTRY}/${IMAGE_NAME}:${DEV_VERSION}\` for linux/amd64 and linux/arm64"
            echo "- Home Assistant add-on images \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/{arch}-navet-addon:${DEV_VERSION}\` for amd64 and aarch64"
            echo
            echo "HACS/custom-panel, \`latest\`, and \`beta\` are unchanged."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-context.outputs.tag_name }}
          name: ${{ needs.release-context.outputs.tag_name }}
          body: ${{ steps.notes.outputs.body }}
          prerelease: true
          generate_release_notes: false

  verify-dev-release:
    name: Verify Navet Dev Artifacts
    runs-on: ubuntu-latest
    needs:
      - release-context
      - runtime
      - github-release
    environment: edge

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify immutable images and prerelease
        env:
          DEV_VERSION: ${{ needs.release-context.outputs.dev_version }}
          TAG_NAME: ${{ needs.release-context.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY_OWNER}/navet:${DEV_VERSION}"
          docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY_OWNER}/amd64-navet-addon:${DEV_VERSION}"
          docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY_OWNER}/aarch64-navet-addon:${DEV_VERSION}"
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json isPrerelease \
            --jq '.isPrerelease' | grep -Fx true

  publish-dev-channels:
    permissions:
      contents: read
      packages: write
    name: Advance tested main-backed Dev channels
    if: needs.release-context.outputs.main_backed == 'true'
    needs: [release-context, verify-dev-release]
    runs-on: ubuntu-latest
    environment: edge
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-image-*
          path: release-images
          merge-multiple: true
      - env:
          RELEASE_SHA: ${{ needs.release-context.outputs.release_sha }}
        run: node scripts/release-dev-channels.mjs
