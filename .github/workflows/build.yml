name: Build

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies and build frontend
        run: |
          npm install
          npm run build
      - name: Prepare release package
        run: |
          mkdir temp_release
          # Копируем Python-файлы интеграции
          cp -r custom_components temp_release/
          # Копируем собранный фронтенд в папку www, как ожидает panel.py
          mkdir -p temp_release/www/navet_ru/
          cp -r dist/* temp_release/www/navet_ru/
          cd temp_release
          zip -r ../navet.zip .
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: navet.zip
          generate_release_notes: true