name: Record Human Approval

on:
  issue_comment:
    types:
      - created
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  approve:
    name: Record maintainer approval for current head
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/approve-')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
      statuses: write
    steps:
      - name: Apply approval label
        uses: actions/github-script@v7
        env:
          PRODUCT_APPROVER: ${{ vars.NAVET_PRODUCT_APPROVER }}
        with:
          script: |
            const permitted = new Set([context.repo.owner, process.env.PRODUCT_APPROVER].filter(Boolean));
            if (!permitted.has(context.payload.comment.user.login)) {
              core.setFailed('Only the configured Navet approver can satisfy human gates.');
              return;
            }

            const command = context.payload.comment.body.trim().split(/\s+/)[0];
            const labels = {
              '/approve-product': 'review: product-approved',
              '/approve-foundation': 'review: foundation-approved',
              '/approve-security': 'review: security-approved',
            };
            const label = labels[command];
            if (!label) {
              core.setFailed(`Unknown approval command: ${command}`);
              return;
            }

            const pull = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const gate = command.replace('/approve-', '');

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: pull.data.head.sha,
              state: 'success',
              context: `navet/${gate}-approval`,
              description: `Approved by ${context.payload.comment.user.login}`.slice(0, 140),
              target_url: context.payload.comment.html_url,
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [label],
            });

  invalidate:
    name: Invalidate approvals after a new commit
    if: github.event_name == 'pull_request_target' && github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Remove approvals for the previous head
        uses: actions/github-script@v7
        with:
          script: |
            for (const name of [
              'review: product-approved',
              'review: foundation-approved',
              'review: security-approved',
              'status: product-review',
            ]) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
