name: Dispatch Coding Agent

on:
  issues:
    types:
      - labeled

permissions:
  contents: read
  issues: write

jobs:
  dispatch:
    name: Hand issue to configured coding agent
    if: github.event.label.name == 'agent:implement' || github.event.label.name == 'agent:research'
    runs-on: ubuntu-latest
    steps:
      - name: Add scoped handoff and assign agent
        uses: actions/github-script@v7
        env:
          AGENT_LOGIN: ${{ vars.NAVET_CODING_AGENT_LOGIN }}
          AGENT_MODE: ${{ github.event.label.name }}
        with:
          script: |
            const marker = `<!-- navet-agent-dispatch:${process.env.AGENT_MODE} -->`;
            const issue = context.payload.issue;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100,
            });

            if (!comments.some((comment) => comment.body?.includes(marker))) {
              const researchOnly = process.env.AGENT_MODE === 'agent:research';
              const instructions = researchOnly
                ? 'Investigate the request against the current repository. Report evidence, acceptance criteria, risks, and open questions. Do not implement unless the issue is relabeled.'
                : 'Triage the request in normal product language, inspect the owning code and Navet constitution, write acceptance criteria, then implement and open a PR when the behavior is clear. Reproduce bugs before fixing them and request missing evidence instead of speculating.';
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `${marker}\n${instructions}\n\nFollow \`AGENTS.md\` and only its routed area guide. The implementing agent may not approve, merge, publish, or weaken deterministic gates.`,
              });
            }

            const agentLogin = process.env.AGENT_LOGIN?.trim();
            if (!agentLogin) {
              core.setFailed('Set the NAVET_CODING_AGENT_LOGIN repository variable to the installed coding agent login.');
              return;
            }

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              assignees: [agentLogin],
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['status: agent-working'],
            });
            for (const name of ['status: needs-triage', 'status: needs-context']) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
