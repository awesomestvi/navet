name: Queue Agent Work

on:
  issues:
    types:
      - labeled

concurrency:
  group: agent-intake-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  queue:
    name: Accept maintainer agent request
    if: github.event.label.name == 'agent:implement' || github.event.label.name == 'agent:research'
    runs-on: ubuntu-latest
    steps:
      - name: Authorize request and update queue state
        uses: actions/github-script@v7
        env:
          AGENT_MODE: ${{ github.event.label.name }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.payload.issue.number;
            const actor = context.actor;
            const trustedAutomation = actor === 'github-actions[bot]';
            const removeLabelIfPresent = async (name) => {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            };

            const { data: currentIssue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber,
            });
            const currentLabels = new Set(
              currentIssue.labels
                .map((label) => typeof label === 'string' ? label : label.name)
                .filter(Boolean)
            );
            if (!currentLabels.has(process.env.AGENT_MODE)) {
              core.notice(`Ignoring stale ${process.env.AGENT_MODE} event for issue #${issueNumber}.`);
              return;
            }

            if (!trustedAutomation) {
              let permission;
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner,
                  repo,
                  username: actor,
                });
                permission = data.permission;
              } catch (error) {
                if (error.status !== 403) throw error;
                core.warning(`Could not verify @${actor}'s repository permission.`);
                await removeLabelIfPresent(process.env.AGENT_MODE);
                core.setFailed('Agent request removed because authorization could not be verified.');
                return;
              }
              const allowed = new Set(['admin', 'maintain', 'write']);
              if (!allowed.has(permission)) {
                await removeLabelIfPresent(process.env.AGENT_MODE);
                core.setFailed(`@${actor} is not allowed to queue agent work.`);
                return;
              }
            }

            const otherMode = process.env.AGENT_MODE === 'agent:implement'
              ? 'agent:research'
              : 'agent:implement';

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issueNumber,
              labels: ['status: agent-queued'],
            });

            for (const name of [
              otherMode,
              'status: needs-triage',
              'status: needs-context',
              'status: agent-working',
            ]) {
              await removeLabelIfPresent(name);
            }
