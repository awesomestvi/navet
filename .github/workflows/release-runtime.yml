name: Verify published runtime

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      version:
        required: true
        type: string
      channel:
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  runtime:
    name: Test published digests (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/setup-qemu-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-image-*
          path: release-images
          merge-multiple: true
      - name: Verify image identity and installed runtime
        env:
          NAVET_ADDON_TEST_ARCH: ${{ matrix.arch }}
          VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: node .release-tools/scripts/release-prebuilt-runtime.mjs
