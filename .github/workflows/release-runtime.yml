name: Verify published runtime

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      version:
        required: true
        type: string
      channel:
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  runtime:
    name: Test published digests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with:
          pattern: release-image-*
          path: release-images
          merge-multiple: true
      - name: Verify image identity and installed runtime
        env:
          NAVET_ADDON_TEST_ARCH: ${{ matrix.arch }}
          VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: node .release-tools/scripts/release-prebuilt-runtime.mjs
