name: Prepare Navet Dev Publish

on:
  workflow_dispatch:
  pull_request_target:
    branches:
      - main
    types:
      - closed

permissions:
  actions: write
  contents: write

jobs:
  tier-1-release-critical:
    name: Release Safety Checks
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    uses: ./.github/workflows/provider-platform-validation.yml

  prepare-dev-release:
    name: Tag Merged Main Commit For Navet Dev
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    needs: tier-1-release-critical

    steps:
      - name: Ensure workflow runs from main
        run: |
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Publish Navet Dev must be dispatched from main. Received ref: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || 'main' }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push Navet Dev tag
        id: publish
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
        run: |
          max_attempts=10
          for attempt in $(seq 1 "$max_attempts"); do
            git fetch --force origin main --tags
            git switch -C main "$(git rev-parse HEAD)"

            if node scripts/create-dev-release.mjs --tag-only --push; then
              tag_name="$(git tag --points-at HEAD --list 'navet-dev-*' --sort=-creatordate | head -n 1)"
              if [[ -z "${tag_name}" ]]; then
                echo "Unable to resolve the published Navet Dev tag."
                exit 1
              fi
              echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [[ "$attempt" -eq "$max_attempts" ]]; then
              echo "Navet Dev publish failed after ${attempt} attempts."
              exit 1
            fi

            sleep $((attempt * 2 + PR_NUMBER % 5))
          done

      - name: Dispatch Navet Dev artifact publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.publish.outputs.tag_name }}
        run: gh workflow run dev-tag-release.yml --ref "${TAG_NAME}"

      - name: Summarize next step
        run: |
          echo "Created and pushed the matching navet-dev tag without advancing protected main."
          echo "The tag-triggered publish workflow will build and publish the dev artifacts."
